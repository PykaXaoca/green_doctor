org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# This newDsl flag was added by the Flutter template
android.newDsl=false

# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Отключает проверку соответствия JVM target между Java и Kotlin задачами.
# Плагин tflite_flutter (а также sentry_flutter в прошлом) собирается
# с Java 11, тогда как основной проект использует Java 17. Эта проверка
# генерирует ошибку "Inconsistent JVM-target compatibility", хотя
# компиляция в байткод проходит корректно.
# Официальный флаг Kotlin: https://kotl.in/jvm-target-validation
kotlin.jvm.target.validation.mode=IGNORE